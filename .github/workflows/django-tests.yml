name: Django CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ejecutar Pruebas Automatizadas (DoD)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vehiculos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vehiculos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # settings.py lee estas variables del entorno (load_dotenv no pisa las existentes),
    # así que no hace falta generar un archivo .env en el CI.
    env:
      SECRET_KEY: ci-test-secret-key-very-long-and-secure-random-token-12345
      DEBUG: "True"
      DB_NAME: vehiculos
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      ALLOWED_HOSTS_EXTRA: testserver,localhost,127.0.0.1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar migraciones
        run: python manage.py migrate --noinput

      - name: Ejecutar pruebas automatizadas
        run: python manage.py test --verbosity=2
